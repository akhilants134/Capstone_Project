# Layer 5: Hosting & Deployment - Docker Compose Specification

version: '3.8'

services:
  # MongoDB Database Layer (Layer 3)
  mongodb:
    image: mongo:6-jammy
    container_name: resource_matcher_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resource-matcher
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend & API Layer (Layers 1, 2, 4, 8, 9, 10, 12, 13)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resource_matcher_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mongodb://mongodb:27017/resource-matcher
      - CLIENT_URL=http://localhost
      - JWT_SECRET=super-secret-capstone-key
    depends_on:
      mongodb:
        condition: service_healthy

  # Nginx Gateway & Load Balancer Layer (Layer 11)
  gateway:
    image: nginx:alpine
    container_name: resource_matcher_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mongo_data:
